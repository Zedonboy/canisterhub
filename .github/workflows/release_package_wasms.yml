name: Release agent, inventory, and asset storage modules

# Builds the agent, inventory, and asset storage modules, then publishes each
# module's Wasm and Candid interface to a GitHub Release.
# `packages/build.sh` builds the UIs before Rust so that:
#   - agent.wasm contains chat-ui
#   - order_inventory.wasm contains inventory-browser and storefront
#
# The backend canister is deliberately not built or published here: it is the
# marketplace/catalog service, not one of the packages users install.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example, v1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/chat-ui/package-lock.json
            packages/inventory-browser/package-lock.json
            packages/storefront/package-lock.json
            packages/table-browser/package-lock.json

      - name: Cache package build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages

      - name: Build modules with embedded UIs
        run: ./packages/build.sh

      - name: Verify release assets
        run: |
          test -s packages/bin/agent.wasm
          test -s packages/bin/agent.did
          test -s packages/bin/order_inventory.wasm
          test -s packages/bin/order_inventory.did
          test -s packages/bin/assetstorage.wasm
          test -s packages/bin/assetstorage.did

      - name: Generate module checksums
        working-directory: packages/bin
        run: |
          sha256sum \
            agent.wasm \
            agent.did \
            order_inventory.wasm \
            order_inventory.did \
            assetstorage.wasm \
            assetstorage.did \
            > SHA256SUMS

      - name: Publish module release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            packages/bin/agent.wasm
            packages/bin/agent.did
            packages/bin/order_inventory.wasm
            packages/bin/order_inventory.did
            packages/bin/assetstorage.wasm
            packages/bin/assetstorage.did
            packages/bin/SHA256SUMS
          fail_on_unmatched_files: true
