schema_version = 2

[template]
name = "Laundry Order Service"
slug = "laundry-order-service"
version = "1.0.0"
description = "Customer accounts, relational order storage, operations API, and a deployable laundry storefront."
category = "Commerce"
tags = ["orders", "laundry", "operations"]

[[packages]]
name = "auth"
url = "https://marketplace.candid.cloud/packages/auth"

[[packages]]
name = "database"
url = "https://marketplace.candid.cloud/packages/ic-sql"
depends_on = ["auth"]

[[packages]]
name = "api"
url = "https://marketplace.candid.cloud/packages/app-api"
depends_on = ["auth", "database"]

[[packages]]
name = "storefront"
url = "https://marketplace.candid.cloud/packages/laundry-order-ui"
depends_on = ["api"]

# Applied via `database`'s own `set_config` once it's installed - see
# `spreadsheet-service/canister_hub.toml`'s matching comment for why
# `database` must list `auth` in `depends_on` for this reference to
# resolve.
[config.database]
auth_canister = "${auth.canister_id}"
