schema_version = 2

[template]
name = "Food Order Service"
slug = "food-order-service"
version = "1.0.0"
description = "A restaurant ordering stack with accounts, relational persistence, API, analytics, and storefront."
category = "Commerce"
tags = ["orders", "food", "analytics"]

[[packages]]
name = "auth"
url = "https://marketplace.candid.cloud/packages/auth"

[[packages]]
name = "database"
url = "https://marketplace.candid.cloud/packages/ic-sql"
depends_on = ["auth"]

[[packages]]
name = "api"
url = "https://marketplace.candid.cloud/packages/app-api"
depends_on = ["auth", "database"]

[[packages]]
name = "analytics"
url = "https://marketplace.candid.cloud/packages/analytics"
depends_on = ["database"]

[[packages]]
name = "storefront"
url = "https://marketplace.candid.cloud/packages/food-order-ui"
depends_on = ["api", "analytics"]

# Applied via `database`'s own `set_config` once it's installed - see
# `spreadsheet-service/canister_hub.toml`'s matching comment for why
# `database` must list `auth` in `depends_on` for this reference to
# resolve.
[config.database]
auth_canister = "${auth.canister_id}"
