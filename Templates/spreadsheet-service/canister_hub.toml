schema_version = 2

[template]
name = "Spreadsheet Service"
slug = "spreadsheet-service"
version = "1.0.0"
description = "A persistent spreadsheet architecture with SilVer UI, identity, and relational storage."
category = "Productivity"
tags = ["spreadsheet", "database", "saas"]

[[packages]]
name = "auth"
url = "https://marketplace.candid.cloud/packages/auth"

[[packages]]
name = "database"
url = "https://marketplace.candid.cloud/packages/ic-sql"
depends_on = ["auth"]

[[packages]]
name = "spreadsheet_ui"
url = "https://marketplace.candid.cloud/packages/silver-spreadsheet-ui"
depends_on = ["auth", "database"]

# Applied via `database`'s own `set_config` (its real `ic::config` surface -
# see `packages/ic-sql/src/config.rs`'s `DynamicConfig` derive) once it's
# installed. `${auth.canister_id}` resolves to `auth`'s real installed
# canister id - only valid because `database` lists `auth` in `depends_on`
# above, which is what guarantees that id already exists by this point.
[config.database]
auth_canister = "${auth.canister_id}"
