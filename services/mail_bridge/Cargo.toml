[package]
name = "mail_bridge"
version = "0.1.0"
edition = "2021"
description = "Two-way bridge between SMTP and canister_hub canisters: an inbound SMTP server that forwards received mail to a canister via ic-agent, and an HTTP API canisters can call (via an HTTPS outcall) to send mail out through an upstream SMTP relay."

[[bin]]
name = "mail_bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

# Outbound HTTP API canisters call to request an email be sent.
axum = "0.8"

# Inbound: parses the raw RFC 5322 message a SMTP DATA command delivers.
mail-parser = "0.11"

# Outbound: relays a send_mail request through an upstream SMTP server.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "webpki-roots",
    "ring",
    "builder",
] }

# IC: signs the update call that forwards inbound mail to a canister.
ic-agent = "0.49"
candid = "0.10"

# Deriving this service's identity from a BIP-39 seed phrase, the same way
# `dfx identity new` does - see src/ic/agent.rs. Same approach (and reasoning)
# as services/orchestrator/src/ic/agent.rs's identity_from_seed_phrase.
bip32 = "0.5"
tiny-bip39 = "2"
k256 = "0.13"

# SPF/DKIM/DMARC verification (inbound) and DKIM signing (outbound) - see
# src/mail/auth.rs. "rust-crypto" for the RsaKey/Ed25519Key signing types and
# the signature-verification math; "dns-hickory" for the plain UDP/TCP DNS
# resolution SPF/DKIM/DMARC's DNS lookups need (no TLS/DNSSEC required for
# that, so neither the "ring" nor "aws-lc-rs" backend feature is pulled in
# here - STARTTLS below brings in "ring" via `rustls` directly instead, and
# the two don't need to be the same crypto backend).
mail-auth = { version = "0.12", default-features = false, features = ["dns-hickory", "rust-crypto"] }

# STARTTLS (RFC 3207): upgrades a session's plaintext TCP connection to TLS
# mid-stream. rustls + ring, matching the crypto backend already used
# elsewhere in this project (reqwest/lettre's "ring" feature).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Loads PEM certs/keys for both STARTTLS and DKIM signing - auto-detects
# PKCS1/PKCS8/SEC1 key formats rather than requiring one specific format.
rustls-pki-types = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
