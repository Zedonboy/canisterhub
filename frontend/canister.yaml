# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/canister-yaml-schema.json

name: frontend

recipe:
  # https://github.com/dfinity/icp-cli-recipes/blob/main/recipes/static-site/README.md
  # IMPORTANT: This recipe requires icp-cli >= 0.2.7
  type: "@dfinity/static-site@v0.3.3"
  configuration:
    build:
      # Deno provides the npm compatibility layer in this workspace, so the
      # recipe does not depend on a separate system-wide npm executable.
      - deno install --node-modules-dir=auto
      - deno run --node-modules-dir=auto -A npm:@icp-sdk/bindgen@0.4.0 --did-file ../backend/backend.did --out-dir ./src/bindings --force
      - deno run --node-modules-dir=auto -A npm:typescript@5.9.3/bin/tsc -b
      - deno run --node-modules-dir=auto -A npm:vite@7.3.1 build
    dir: dist
