# Tells `icp new --path` (cargo-generate under the hood) never to scan this
# source for `{{...}}` template placeholders - there are none; this is
# plain, already-correct source meant to be copied through unchanged, not
# a templated scaffold. Without this, cargo-generate tries to
# template-scan every file including binary artifacts under `target/`
# (once this crate has been built at least once) and fails outright -
# verified directly: `icp new <name> --path packages/<this> -s -o --vcs
# none` exits 1 with "Consider adding these files to a cargo-generate.toml"
# once `target/` exists, and succeeds with this file present regardless.
[template]
exclude = ["target/**", ".git/**"]
