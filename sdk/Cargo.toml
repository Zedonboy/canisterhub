[package]
name = "canister-hub-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust and WebAssembly clients for canister_hub's ic-sql, ic-kv, and auth canisters"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["client"]
client = ["dep:ic-agent"]
ic = ["dep:ic-cdk", "dep:ic-stable-structures", "dep:canister-hub-sdk-macros"]
browser = [
    "client",
    "ic-agent/wasm-bindgen",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
# Backward-compatible feature aliases.
agent = ["client"]
canister = ["ic"]
js = ["browser"]

[dependencies]
candid = "0.10"
ic-agent = { version = "0.49", default-features = false, optional = true }
ic-cdk = { version = "0.19", optional = true }
ic-stable-structures = { version = "0.7", optional = true }
canister-hub-sdk-macros = { path = "macros", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Pinned to match the local PocketIC server used by tests - see
# backend/Cargo.toml's identical pin.
pocket-ic = "15.0.0"
